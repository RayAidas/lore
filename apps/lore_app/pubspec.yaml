name: lore_app
description: Lore desktop and mobile application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  charset_converter: ^2.5.1
  file_picker: ^8.1.0
  flutter_riverpod: ^3.0.0
  lore_application:
    path: ../../packages/lore_application
  lore_domain:
    path: ../../packages/lore_domain
  lore_editor:
    path: ../../packages/lore_editor
  lore_platform_adapters:
    path: ../../packages/lore_platform_adapters
  lore_storage:
    path: ../../packages/lore_storage
  lore_ui:
    path: ../../packages/lore_ui
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences: ^2.5.3

flutter:
  uses-material-design: true
  fonts:
    # 霞鹜文楷 LXGW WenKai（OFL-1.1，见 fonts/OFL-LXGW.txt）：网文/长文阅读
    # 公认最舒适的字体之一，系统不带，跨平台一致。仅内置 Regular；标题加粗
    # 由 Flutter 合成。
    - family: LXGWWenKai
      fonts:
        - asset: fonts/LXGWWenKai-Regular.ttf
